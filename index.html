<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieHub — Смотреть кино</title>
    <link href="https://fonts.googleapis.com/css2?family=Inspiration&family=Iceland&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">MovieHub</div>
        <nav>
            <ul>
                <li><a href="#">ГЛАВНАЯ</a></li>
                <li><a href="#">КАТЕГОРИИ</a></li>
                <li><a href="#">БИЛЕТЫ</a></li>
                <li><a href="#">НОВИНКИ</a></li>
            </ul>
        </nav>
        <div class="user-icon"></div>
    </header>

    <main>
       
        <section class="hero">
            <div class="hero-content">
                <h1 class="movie-title">DUNE</h1>
                <p class="movie-desc">Адаптация научно-фантастического романа Фрэнка Герберта о сыне благородной семьи, доверенном защите самого ценного актива и самого опасного элемента в галактике.</p>
                <div class="hero-btns">
                    <button id="welcomeBtn" class="btn-red">СМОТРЕТЬ</button>
                    <button class="btn-outline">ТРЕЙЛЕР</button>
                </div>
            </div>
        </section>

        <section class="catalog">
            <h2 class="section-title">СЕЙЧАС В КИНО</h2>
            <div class="movie-grid">
                <div class="movie-card" style="background-image: url('https://avatars.mds.yandex.net/get-kinopoisk-image/1898893/788339c6-0153-48b4-82a1-e4078869c9b4/300x450');"></div>
                <div class="movie-card ticket">
                    <div class="ticket-content">
                        <span>ADMIT ONE</span>
                        <strong>БИЛЕТ НА СЕАНС</strong>
                    </div>
                </div>
                <div class="movie-card" style="background-image: url('https://avatars.mds.yandex.net/get-kinopoisk-image/4303601/69796e62-c070-4209-847e-976410425555/300x450');"></div>
                <div class="movie-card" style="background-image: url('https://avatars.mds.yandex.net/get-kinopoisk-image/10803443/73254302-7634-453b-a82a-2a493f0b263b/300x450');"></div>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
